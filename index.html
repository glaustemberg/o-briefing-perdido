<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #jogo { position: relative; width: 100vw; height: 100vh; }
  #jogo canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #fonte-pre { position: absolute; left: -9999px; top: 0; font-family: "Press Start 2P", monospace; }
  /* celular em pe deixa o jogo numa faixa estreita: o aviso pede a virada sem tapar a tela (decisao 74) */
  #vire { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #vire { display: block; position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
            font-family: "Press Start 2P", monospace; font-size: 12px; color: #FFCF3F; z-index: 5; }
  }
</style>
