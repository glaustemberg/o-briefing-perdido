<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tikinho &amp; gilpp: O Briefing Perdido</title>
<meta name="description" content="o jogo da dot.: tikinho e gilpp em O Briefing Perdido.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Pixelify+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/site.css">
</head>
<body>

<section id="abertura">
 <div class="abertura-fixo">
  <div class="abertura-img-wrap" id="abertura-img-wrap" aria-hidden="true">
    <div class="abertura-img"></div>
  </div>
  <canvas id="rolagem-canvas" class="rolagem-canvas" aria-hidden="true"></canvas>

  <div class="abertura-conteudo">
    <div class="abertura-eyebrow">
      <span>o jogo da</span>
      <img class="logo-dot" src="site/logo-dot.svg" alt="dot.">
    </div>
    <h1 class="abertura-titulo">tikinho &amp; gilpp</h1>
    <p class="abertura-subtitulo">O Briefing Perdido</p>
    <button type="button" class="botao botao-primario" id="btn-jogar">jogar agora</button>
  </div>

  <p class="abertura-dica">role para ver a mesa</p>
 </div>
</section>

<section id="mesa">
  <div class="mesa">
    <div class="tela" id="tela">
      <div class="jogo-caixa" id="jogo-caixa">
        <div class="standby" id="standby">
          <p class="standby-titulo">tikinho &amp; gilpp</p>
          <button type="button" class="botao botao-primario" id="btn-ligar">ligar</button>
          <button type="button" class="botao botao-secundario botao-pequena" id="btn-tela-cheia">tela cheia</button>
        </div>
      </div>
      <button type="button" class="botao-sair" id="btn-sair" aria-label="sair da tela cheia">sair</button>
      <div class="aviso-girar" id="aviso-girar">
        <p>gire o aparelho</p>
      </div>
    </div>
  </div>
  <p class="mesa-legenda">clique no monitor para jogar. F ou duplo clique para tela cheia</p>
</section>

<section id="controles">
  <div class="chips">
    <div class="chip"><span class="chip-tecla">setas</span><span class="chip-desc">andam</span></div>
    <div class="chip"><span class="chip-tecla">espaco</span><span class="chip-desc">pula</span></div>
    <div class="chip"><span class="chip-tecla">M</span><span class="chip-desc">soca</span></div>
    <div class="chip"><span class="chip-tecla">B</span><span class="chip-desc">troca o item</span></div>
    <div class="chip"><span class="chip-tecla">N</span><span class="chip-desc">usa</span></div>
    <div class="chip"><span class="chip-tecla">enter</span><span class="chip-desc">confirma</span></div>
  </div>

  <footer class="rodape">
    <img class="logo-dot logo-dot-rodape" src="site/logo-dot.svg" alt="dot.">
    <p>feito na dot., Recife</p>
    <a href="https://github.com/glaustemberg/o-briefing-perdido" target="_blank" rel="noopener">github.com/glaustemberg/o-briefing-perdido</a>
  </footer>
</section>

<script>window.__QUADROS = 72;</script>
<script src="site/site.js" defer></script>
<script src="site/rolagem.js" defer></script>
</body>
</html>
