<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>testes M1</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 16px; }
  .ok { color: #7ED957; } .falha { color: #F26A4A; }
</style>
</head>
<body>
<h1>testes M1</h1>
<pre id="saida"></pre>
<script src="../js/data/paleta.js"></script>
<script src="../js/config.js"></script>
<script src="../js/data/herois.js"></script>
<script src="../js/data/fase-01.js"></script>
<script src="../js/data/fase-chefe.js"></script>
<script src="../js/data/fase-02.js"></script>
<script src="../js/data/fase-05.js"></script>
<script src="../js/data/fase-08a.js"></script>
<script src="../js/data/fase-08b.js"></script>
<script src="../js/systems/Mapa.js"></script>
<script src="../js/systems/Save.js"></script>
<script src="../js/data/loja.js"></script>
<script src="../js/systems/Voice.js"></script>
<script>
const T = [], saida = document.getElementById('saida');
function teste(nome, fn) { T.push({ nome, fn }); }
function igual(a, b, msg) { if (a !== b) throw new Error(`${msg || ''} esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`); }
function perto(a, b, tol, msg) { if (Math.abs(a - b) > tol) throw new Error(`${msg || ''} esperado ${b} ± ${tol}, veio ${a}`); }
function lanca(fn, msg) { let ok = false; try { fn(); } catch (e) { ok = true; } if (!ok) throw new Error(`${msg || ''} devia lançar erro`); }
function rodar() {
  let passou = 0;
  for (const t of T) {
    try { t.fn(); saida.innerHTML += `<span class="ok">PASS</span> ${t.nome}\n`; passou++; }
    catch (e) { saida.innerHTML += `<span class="falha">FAIL</span> ${t.nome}: ${e.message}\n`; }
  }
  saida.innerHTML += `\n${passou}/${T.length} passaram`;
  document.title = `${passou}/${T.length} testes M1`;
}

// paleta
teste('paleta tem 36 cores únicas em hex maiúsculo', () => {
  const l = OBP.PAL.lista();
  igual(l.length, 36, 'quantidade');
  igual(new Set(l).size, 36, 'repetidas');
  for (const h of l) if (!/^#[0-9A-F]{6}$/.test(h)) throw new Error(`cor fora do formato: ${h}`);
  igual(OBP.PAL.num('#582C83'), 0x582C83, 'num');
});
teste('paleta traz os hex fixos da spec', () => {
  igual(OBP.PAL.contorno, '#0D0B12'); igual(OBP.PAL.roxo, '#582C83'); igual(OBP.PAL.petroleo, '#2E6B7A');
  igual(OBP.PAL.coracao, '#D63A2F'); igual(OBP.PAL.moeda, '#FFCF3F'); igual(OBP.PAL.ceu, '#8FD3F4');
});

// zoom inteiro por pixel físico (spec 2.1 e 9)
teste('zoom físico: 720p 2x, 1080p 3x, 1440p 4x, janela pequena 1x', () => {
  igual(OBP.zoomFisico(1280, 720, 1), 2); igual(OBP.zoomFisico(1920, 1080, 1), 3);
  igual(OBP.zoomFisico(2560, 1440, 1), 4); igual(OBP.zoomFisico(500, 300, 1), 1);
});
teste('zoom CSS: 1080p a 125% dá físico 3x e CSS 2,4; a 150% dá 3x', () => {
  igual(OBP.zoomFisico(1536, 864, 1.25), 3); perto(OBP.zoomInteiro(1536, 864, 1.25), 2.4, 1e-9);
  igual(OBP.zoomFisico(1280, 720, 1.5), 3); perto(OBP.zoomInteiro(1280, 720, 1.5), 3 / 1.5, 1e-9);
});

// parser do mapa ASCII (spec 5 e 9)
teste('fase 1 mede 128x14 e devolve dados e entidades', () => {
  const m = OBP.Mapa.parse(OBP.FASES['fase-01'].mapa);
  igual(m.larg, 128, 'larg'); igual(m.alt, 14, 'alt');
  igual(m.dados.length, 14, 'linhas'); igual(m.dados[0].length, 128, 'colunas');
});
teste('fase 1 tem 27 estrelas, 2 caveiras, 3 perguntas, 3 reforçados, 6 espinhos e chão sólido', () => {
  const m = OBP.Mapa.parse(OBP.FASES['fase-01'].mapa);
  const conta = i => m.dados.flat().filter(v => v === i).length;
  igual(conta(2), 27, 'estrelas (16 + 11 das formações da decisão 88)'); igual(conta(8), 2, 'caveiras'); igual(conta(3), 3, 'perguntas'); igual(conta(4), 3, 'reforçados'); igual(conta(5), 6, 'espinhos');
  igual(m.dados[13][0], 0, 'chão'); igual(m.dados[12][127], 0, 'parede direita');
  igual(m.dados[4][90], 1, 'one-way'); igual(m.dados[10][70], 4, 'R'); igual(m.dados[9][24], 3, '? 1');
});
teste('fase 1 tem 3 buracos de 3 tiles na última linha', () => {
  const m = OBP.Mapa.parse(OBP.FASES['fase-01'].mapa);
  const buracos = m.dados[13].map((v, i) => v === -1 ? i : -1).filter(i => i >= 0);
  igual(JSON.stringify(buracos), JSON.stringify([36, 37, 38, 88, 89, 90, 105, 106, 107]));
});
teste('fase 1 tem 16 sacos, 13 inimigos, P em (2,12), K em (66,12), X em (124,12)', () => {
  const m = OBP.Mapa.parse(OBP.FASES['fase-01'].mapa);
  const de = ch => m.entidades.filter(e => e.ch === ch);
  igual(de('$').length, 16, 'sacos'); igual(de('1').length + de('2').length + de('3').length, 13, 'inimigos');   // subiu de 6 na decisao 67
  igual(de('P')[0].col, 2); igual(de('P')[0].lin, 12); igual(de('K')[0].col, 66); igual(de('X')[0].col, 124);
  igual(de('A').length, 1, 'carimbo'); igual(de('N').length, 2, 'meninas loiras');
  igual(m.dados[12][2], -1, 'entidade vira -1 no tilemap');
  igual(OBP.Mapa.parse(['P.C']).dados[0][2], 8, 'C e o bloco caveira, tile 8 (decisao 88)');
  igual(OBP.INIMIGOS.fantasma.atravessa, true); igual(OBP.INIMIGOS.fantasma.invencivel, true);
});
teste('parser rejeita largura desigual, mapa vazio e mapa sem P', () => {
  lanca(() => OBP.Mapa.parse(['#.', '###']), 'largura');
  lanca(() => OBP.Mapa.parse([]), 'vazio');
  lanca(() => OBP.Mapa.parse(['....', '####']), 'sem P');
});

// física do pulo (spec 3 e 4): o simulador usa o integrador do Arcade (v += g*dt; y += v*dt a 1/60)
teste('tikinho: pulo cheio dá 3,5 tiles (112 px ± 4) com decolagem de 4 px e pausa no ápice', () => {
  const r = OBP.Fisica.simularPulo(OBP.HEROIS.tikinho);
  perto(r.alturaPx, 112, 4, 'altura'); perto(r.tiles, 3.5, 0.125, 'tiles');
});
teste('gilpp: pulo cheio dá 4,5 tiles (144 px ± 4)', () => {
  const r = OBP.Fisica.simularPulo(OBP.HEROIS.gilpp);
  perto(r.alturaPx, 144, 4, 'altura'); perto(r.tiles, 4.5, 0.125, 'tiles');
});
teste('pulo curto (solta em 2 f) fica entre 1 e 2 tiles e abaixo da metade do cheio', () => {
  for (const id of ['tikinho', 'gilpp']) {
    const h = OBP.HEROIS[id], cheio = OBP.Fisica.simularPulo(h).alturaPx, curto = OBP.Fisica.simularPulo(h, 2).alturaPx;
    if (curto < 32 || curto > 64) throw new Error(`${id}: curto ${curto}`);
    if (curto >= cheio / 2) throw new Error(`${id}: curto ${curto} não é menor que metade de ${cheio}`);
  }
});
teste('coyote 100 ms: pula 90 ms depois de sair do chão, não pula aos 130', () => {
  const h = OBP.HEROIS.tikinho;
  igual(OBP.Fisica.podePular(1090, 1000, 1090, h), true, '90 ms');
  igual(OBP.Fisica.podePular(1130, 1000, 1130, h), false, '130 ms');
});
teste('buffer: aperto 120 ms antes de pousar vale para os dois; 150 vale só para o gilpp (167)', () => {
  igual(OBP.Fisica.podePular(1120, 1120, 1000, OBP.HEROIS.tikinho), true);
  igual(OBP.Fisica.podePular(1150, 1150, 1000, OBP.HEROIS.tikinho), false);
  igual(OBP.Fisica.podePular(1150, 1150, 1000, OBP.HEROIS.gilpp), true);
});
teste('gravidade: subida usa gSubida, queda usa gQueda, pausa no ápice zera', () => {
  const h = OBP.HEROIS.tikinho;
  igual(OBP.Fisica.gravidade(h, -100, 0), 1552); igual(OBP.Fisica.gravidade(h, 100, 0), 2328);
  igual(OBP.Fisica.gravidade(h, -10, 0.02), 0);
  igual(OBP.Fisica.gravidade(OBP.HEROIS.gilpp, 5, 0), 2040);
});
teste('terminal corta em 480 e o corte de 0,5 só age subindo', () => {
  igual(OBP.Fisica.terminal(600), 480); igual(OBP.Fisica.terminal(200), 200);
  igual(OBP.Fisica.cortar(-400), -200); igual(OBP.Fisica.cortar(300), 300);
});
teste('aceleração: tikinho chega a 220 em 6 f e gilpp a 170 em 10 f', () => {
  const corre = (h, n) => { let vx = 0; for (let i = 0; i < n; i++) vx = OBP.Fisica.andar(vx, h.vel, h, 1 / 60); return vx; };
  perto(corre(OBP.HEROIS.tikinho, 6), 220, 0.01); if (corre(OBP.HEROIS.tikinho, 5) > 219) throw new Error('rápido demais');
  perto(corre(OBP.HEROIS.gilpp, 10), 170, 0.01); if (corre(OBP.HEROIS.gilpp, 9) > 169) throw new Error('rápido demais');
});
teste('freio: tikinho para de 220 em 5 f, gilpp de 170 em 8 f', () => {
  const freia = (h, n) => { let vx = h.vel; for (let i = 0; i < n; i++) vx = OBP.Fisica.andar(vx, 0, h, 1 / 60); return vx; };
  perto(freia(OBP.HEROIS.tikinho, 5), 0, 0.01); perto(freia(OBP.HEROIS.gilpp, 8), 0, 0.01);
});

// vozes (spec 8): 1 canal, reação a cada 20 s, dano e morte com cooldown próprio de 4 s, garantidas fora do teto
teste('classe do id: dano e morte urgentes, início/check/vitória/seleção garantidas, resto reação', () => {
  igual(OBP.VoiceLogic.classe('tk-dano-01'), 'urgente'); igual(OBP.VoiceLogic.classe('gp-morte-01'), 'urgente');
  igual(OBP.VoiceLogic.classe('gp-inicio-f1'), 'garantida'); igual(OBP.VoiceLogic.classe('tk-check-01'), 'garantida');
  igual(OBP.VoiceLogic.classe('tk-vitfase-01'), 'garantida'); igual(OBP.VoiceLogic.classe('gp-sel-01'), 'garantida');
  igual(OBP.VoiceLogic.classe('tk-pulo-01'), 'reacao'); igual(OBP.VoiceLogic.classe('tk-moeda-01'), 'reacao');
});
teste('sorteio de variante nunca repete a última e cai para a única opção', () => {
  const e = {}, L = ['a', 'b', 'c'];
  const s1 = OBP.VoiceLogic.sorteia(e, L, 0.0); igual(s1, 'a');
  igual(OBP.VoiceLogic.sorteia(e, L, 0.0), 'b', 'com rnd 0 a proxima e a primeira que nao e a ultima');
  igual(OBP.VoiceLogic.sorteia(e, L, 0.99), 'c'); igual(OBP.VoiceLogic.sorteia(e, L, 0.99), 'b');
  igual(OBP.VoiceLogic.sorteia(e, ['x'], 0.5), 'x'); igual(OBP.VoiceLogic.sorteia(e, ['x'], 0.5), 'x', 'uma opcao so repete');
  igual(OBP.VoiceLogic.sorteia(e, [], 0.5), null);
  igual(OBP.VoiceLogic.classe('tk-cinicio-02'), 'garantida'); igual(OBP.VoiceLogic.classe('tk-dano-c1'), 'urgente'); igual(OBP.VoiceLogic.classe('gp-cbatata-01'), 'reacao');
});
teste('reação respeita o teto de 20 s', () => {
  const e = OBP.VoiceLogic.criar();
  igual(OBP.VoiceLogic.decidir(e, 'tk-pulo-01', 1000), true, 'primeira');
  igual(OBP.VoiceLogic.decidir(e, 'tk-soco-01', 20999), false, 'aos 19,999 s');
  igual(OBP.VoiceLogic.decidir(e, 'tk-soco-01', 21000), true, 'aos 20 s');
});
teste('garantida sempre toca e não gasta o teto da reação', () => {
  const e = OBP.VoiceLogic.criar();
  igual(OBP.VoiceLogic.decidir(e, 'tk-inicio-f1', 0), true);
  igual(OBP.VoiceLogic.decidir(e, 'tk-check-01', 10), true);
  igual(OBP.VoiceLogic.decidir(e, 'tk-pulo-01', 20), true, 'reação logo depois');
});
teste('urgente tem cooldown próprio de 4 s e não gasta o teto da reação', () => {
  const e = OBP.VoiceLogic.criar();
  igual(OBP.VoiceLogic.decidir(e, 'tk-dano-01', 0), true);
  igual(OBP.VoiceLogic.decidir(e, 'tk-dano-01', 3999), false);
  igual(OBP.VoiceLogic.decidir(e, 'tk-pulo-01', 100), true, 'reação após dano');
  igual(OBP.VoiceLogic.decidir(e, 'tk-morte-01', 4000), true);
});
teste('cada(chave, n) dispara só no múltiplo de n', () => {
  const e = OBP.VoiceLogic.criar();
  let vezes = 0; for (let i = 0; i < 25; i++) if (OBP.VoiceLogic.cada(e, 'soco', 10)) vezes++;
  igual(vezes, 2); igual(OBP.VoiceLogic.cada(e, 'moeda', 1), true);
});

// layout do HUD do M2 (adendo 1 e 2, spec 2.11): ícone de 32 px e 5 dígitos de 16 px por contador, nada encostando
teste('HUD: corações, lâmpadas, prazo e slot de item não se sobrepõem', () => {
  const c = OBP.hudCaixas();
  igual(c.length, 6, 'caixas');
  igual(c[0].x1, 176, '8 corações terminam em 176');
  igual(c[2].x0, 224, 'dígitos de lâmpada começam em 224'); igual(c[2].x1, 304, 'borda direita da lâmpada');
  igual(c[4].x1, 472, 'borda direita do prazo');
  igual(c[5].x1, 624, 'slot de item termina na margem de 16 px');
  igual(OBP.hudColide(), null, OBP.hudColide() || '');
  igual(OBP.CFG.HUD.CORACAO_MAX, 8, '4 do FACIL mais o permanente mais 3 extras da armadura');
});
// prazo por fase (adendo 2): regressivo em branco, progressivo em vermelho, bônus de lâmpadas por tempo restante
teste('relógio formata mm:ss, inclusive no overtime e no teto', () => {
  igual(OBP.Relogio.formatar(180), '03:00'); igual(OBP.Relogio.formatar(0), '00:00');
  igual(OBP.Relogio.formatar(59.9), '00:59'); igual(OBP.Relogio.formatar(61), '01:01');
  igual(OBP.Relogio.formatar(-5), '00:05', 'overtime conta para cima');
  igual(OBP.Relogio.formatar(-125), '02:05'); igual(OBP.Relogio.formatar(99999), '99:59', 'teto');
  igual(OBP.Relogio.atrasado(0.4), false); igual(OBP.Relogio.atrasado(-0.1), true);
});
teste('bônus de tempo: 1 lâmpada a cada 4 s, arredondado para baixo, teto 40, nunca negativo', () => {
  igual(OBP.Relogio.bonus(7), 1, 'arredonda para baixo, não para o mais próximo');
  igual(OBP.Relogio.bonus(0), 0);
  igual(OBP.Relogio.bonus(-30), 0, 'quem estourou o prazo não ganha bônus');
  igual(OBP.Relogio.bonus(160), 40, 'no limite exato do teto');
  igual(OBP.Relogio.bonus(220), 40, 'passou do teto, trava em 40');
});
// prazos apertados na decisao 67: o bonus de lampada e min(40, seg/4), entao cortar tempo tambem encarece a loja
teste('tabela de prazos: as 4 fases do escopo atual, e a fase 8 soma 230 s nas duas metades', () => {
  igual(Object.keys(OBP.PRAZOS).length, 6, 'fases com prazo (08 conta como 2 metades, mais a arena do chefe)');
  igual(OBP.PRAZOS['fase-01'], 140); igual(OBP.PRAZOS['fase-02'], 170); igual(OBP.PRAZOS['fase-05'], 170);
  igual(OBP.PRAZOS['fase-08a'] + OBP.PRAZOS['fase-08b'], 230, 'as duas metades da fase 8');
});
// dificuldade (decisao 84): MEDIO tem que ser o jogo de antes, e os outros dois andam cada um para um lado
teste('dificuldade: medio igual ao CFG, facil mais leve, bomba mais pesada, densidade exata', () => {
  const D = OBP.DIFICULDADES, reg = (id) => ({ get: () => id });
  igual(Object.keys(D).join(), 'facil,medio,bomba');
  igual(D.medio.vidas, OBP.CFG.VIDAS); igual(D.medio.coracoes, OBP.CFG.CORACOES);
  igual(D.medio.invencivelMs, OBP.CFG.INVENCIVEL_MS);
  ['prazo', 'vel', 'ritmo', 'densidade'].forEach(k => igual(D.medio[k], 1, `medio.${k}`));
  igual(OBP.dif(reg('bomba')).id, 'bomba'); igual(OBP.dif(reg(undefined)).id, 'medio', 'sem escolha cai no medio');
  igual(OBP.dif(null).id, 'medio');
  igual(D.facil.vidas > D.medio.vidas && D.medio.vidas > D.bomba.vidas, true, 'vidas em ordem');
  igual(D.facil.vel < 1 && D.bomba.vel > 1 && D.facil.ritmo > 1 && D.bomba.ritmo < 1, true, 'inimigo');
  const nascem = (dens, n) => Array.from({ length: n }, (_, i) => OBP.nasceInimigo(i, dens)).filter(Boolean).length;
  igual(nascem(1, 15), 15); igual(nascem(0.6, 15), 9); igual(nascem(0.6, 5), 3);
  // o FACIL com o coracao da loja e a armadura ainda cabe no HUD
  igual(D.facil.coracoes + 1 + 3 <= OBP.CFG.HUD.CORACAO_MAX, true, 'coracoes do facil no HUD');
  const e = { lampadas: 100, coracoesMax: 4, coracoesBase: 4, coracoesExtra: 0, pulosExtra: 0, inventario: [] };
  igual(OBP.Loja.motivo(e, 'coracao'), null, 'facil com 4 base ainda pode comprar o permanente');
  igual(OBP.Loja.motivo(Object.assign({}, e, { coracoesMax: 5 }), 'coracao'), 'JÁ TEM');
  igual(OBP.Loja.motivo(Object.assign({}, e, { coracoesMax: 3, coracoesBase: 2 }), 'coracao'), 'JÁ TEM', 'bomba');
});
// arena do chefe (decisao 85): uma tela fechada, sem saida, e as maos do jokenpo com a regra de sempre
teste('arena do chefe: 20x11 fechada, heroi a esquerda, sem saida, e briefing e papel, prazo e pedra, verba e tesoura', () => {
  const m = OBP.Mapa.parse(OBP.FASES['chefe'].mapa);
  igual(m.dados.length, 11, 'linhas'); igual(m.dados[0].length, 20, 'colunas');
  igual(m.dados[10].every(v => v === 0), true, 'chao inteiro na ultima linha');
  igual(m.dados.every(l => l[0] === 0 && l[19] === 0), true, 'paredes dos dois lados');
  igual(!!m.entidades.find(e => e.ch === 'P'), true, 'tem P'); igual(!!m.entidades.find(e => e.ch === 'X'), false, 'nao tem X');
  const J = OBP.JOKENPO;
  igual(J.MAO.briefing, 'papel'); igual(J.MAO.prazo, 'pedra'); igual(J.MAO.verba, 'tesoura');
  igual(J.duelo('briefing', 'prazo'), 1, 'papel vence pedra'); igual(J.duelo('prazo', 'verba'), 1, 'pedra vence tesoura');
  igual(J.duelo('verba', 'briefing'), 1, 'tesoura vence papel'); igual(J.duelo('verba', 'verba'), 0, 'empate');
  igual(OBP.CHEFE.VIDA_CABECA + OBP.CHEFE.VIDA_CORPO, 7, 'vida total do Sobrinho');
  igual(OBP.CFG.FASE_FINAL, 'chefe'); igual(OBP.proximaFase('fase-08b'), 'chefe', 'a torre leva a arena');
});
teste('ordem das fases: a loja leva a fase seguinte e a ultima cai na Selecao', () => {
  igual(OBP.ORDEM.join(), 'fase-01,fase-02,fase-05,fase-08a,fase-08b,chefe');
  igual(OBP.proximaFase('fase-01'), 'fase-02'); igual(OBP.proximaFase('fase-08a'), 'fase-08b');
  igual(OBP.proximaFase(OBP.CFG.FASE_FINAL), null, 'depois da ultima nao tem proxima');
  igual(OBP.ORDEM[OBP.ORDEM.length - 1], OBP.CFG.FASE_FINAL, 'a ultima da ordem e a fase do chefe');
});
// arquétipos de inimigo do M2 (adendo 7). Sem folha 'inimigos32' nesta arte final (Boot carrega uma imagem por
// estado), então em vez de OBP.frame() a checagem confere contra a lista real de chaves que o Boot carrega.
teste('tabela de inimigos: 6 arquétipos, texturas conhecidas e famílias válidas', () => {
  const fams = ['patrulha', 'nuvem', 'loira', 'bomba', 'raio', 'fantasma'];
  igual(Object.keys(OBP.INIMIGOS).join(','), 'abacaxi,nuvem,loira,bomba,raio,fantasma', 'arquétipos');   // post-it saiu na decisao 70, fantasma entrou na 88
  // chaves de textura carregadas pelo Boot ('ini-*' e 'proj-*', Boot.js)
  const texturas = ['ini-nuvem-a', 'ini-nuvem-dorme', 'ini-nuvem-raio', 'ini-loira-idle', 'ini-loira-a',
    'ini-loira-arremessa', 'ini-abacaxi-a', 'ini-abacaxi-b', 'ini-abacaxi-c', 'ini-abacaxi-morto',
    'ini-bomba-solta', 'proj-raio-solto', 'proj-bomba', 'ini-fantasma-a', 'ini-fantasma-b', 'ini-fantasma-c'];
  for (const [id, t] of Object.entries(OBP.INIMIGOS)) {
    if (!fams.includes(t.fam)) throw new Error(`${id}: família ${t.fam}`);
    for (const campo of ['frame', 'frameMorto', 'frameDorme', 'frameAviso', 'frameAlt', 'frameArremessa', 'framePousada', 'frameGrita']) {
      if (t[campo] && !texturas.includes(t[campo])) throw new Error(`${id}.${campo}: textura desconhecida ${t[campo]}`);
    }
  }
  igual(OBP.INIMIGOS.abacaxi.vel, 230, 'abacaxi corre a 230 px/s');
  igual(OBP.INIMIGOS.nuvem.grav, 0, 'nuvem não cai');
  igual(OBP.INIMIGOS.nuvem.dy, -96, 'nuvem nasce 3 tiles acima da marca do mapa');
  // decisao 68: a bomba deixou de ser inofensiva em voo. Quica 3 vezes, explode, e encostar nela mata na hora.
  igual(OBP.INIMIGOS.bomba.fere, undefined, 'bomba fere desde o voo');
  igual(OBP.INIMIGOS.bomba.quiquesAteExplodir, 3); igual(OBP.INIMIGOS.bomba.quique > 0, true, 'bomba quica');
  igual(OBP.INIMIGOS.loira.corpo.join(), '26,56', 'menina de 64 px tem hitbox de gente');
  igual(OBP.INIMIGOS.abacaxi.corpo.join(), '32,40', 'abacaxi de 48 px tem hitbox maior');
  igual(OBP.INIMIGOS.bomba.invencivel, true); igual(OBP.INIMIGOS.raio.invencivel, true);
});
// escopo do M2 (decisão do Berg, 17/09): só fases 1, 2, 5 e 8 existem no jogo. As fases 3, 6 e 7 do plano
// original ficam fora e não recebem nuvem/loira/abacaxi.
teste('fases em escopo: nuvem em 8a; loira em 2 e 5; abacaxi em 1; o slot do post-it virou a menina', () => {
  const tem = (f, id) => OBP.FASES[f].inimigos.includes(id);
  igual(tem('fase-08a', 'nuvem'), true, 'nuvem em fase-08a');
  for (const f of ['fase-02', 'fase-05']) igual(tem(f, 'loira'), true, `loira em ${f}`);
  igual(tem('fase-01', 'abacaxi'), true, 'abacaxi em fase-01');
  igual(tem('fase-01', 'loira'), true, 'a menina entra no slot que era do post-it');
  for (const f of Object.keys(OBP.FASES)) igual(OBP.FASES[f].inimigos.length, 3, `${f}: 3 slots`);
  // decisao 67: slot apontando para arquetipo inexistente nao nasce inimigo nenhum, e foi assim que as fases 2, 5
  // e 8 ficaram praticamente vazias. Nas fases em escopo os 3 slots precisam existir em OBP.INIMIGOS.
  for (const f of OBP.ORDEM.filter(f => OBP.FASES[f])) for (const id of OBP.FASES[f].inimigos) igual(!!OBP.INIMIGOS[id], true, `${f}: ${id}`);
});

// armadura roxa (adendo 6): 3 corações extras, drenados antes dos normais
teste('dano drena o coração extra antes do normal e volta à forma normal no zero', () => {
  igual(OBP.CFG.CORACOES_ARMADURA, 3);
  igual(OBP.Armadura.vestida(3), true); igual(OBP.Armadura.vestida(0), false);
  let e = { coracoes: 3, extra: 3 };
  e = OBP.Armadura.dano(e.coracoes, e.extra); igual(e.extra, 2); igual(e.coracoes, 3, 'normal intacto');
  e = OBP.Armadura.dano(e.coracoes, e.extra); igual(e.extra, 1);
  e = OBP.Armadura.dano(e.coracoes, e.extra); igual(e.extra, 0); igual(e.coracoes, 3, 'ainda intacto');
  igual(OBP.Armadura.vestida(e.extra), false, 'saiu da armadura sem perder coração normal');
  e = OBP.Armadura.dano(e.coracoes, e.extra); igual(e.coracoes, 2); igual(e.extra, 0);
  igual(OBP.Armadura.dano(1, 0).coracoes, 0, 'último coração leva a zero');
});
teste('armadura: célula maior, mesma hitbox, pé na última linha da célula', () => {
  for (const id of ['tikinho', 'gilpp']) {
    const h = OBP.HEROIS[id];
    if (!(h.celulaArmadura > h.celula)) throw new Error(`${id}: célula de armadura não é maior`);
    // o offset do corpo é recalculado pela célula em uso; o pé fica na base da célula nas duas formas
    igual((h.celulaArmadura - h.hitbox.w) % 2, 0, `${id}: offset horizontal inteiro`);
    if (h.celulaArmadura - h.hitbox.h < 0) throw new Error(`${id}: hitbox maior que a célula`);
  }
  igual(OBP.HEROIS.tikinho.celulaArmadura, 96); igual(OBP.HEROIS.gilpp.celulaArmadura, 128);
  igual(OBP.HEROIS.tikinho.hitbox.h, 52, 'hitbox do tikinho intacta'); igual(OBP.HEROIS.gilpp.hitbox.h, 68);
  igual(OBP.FRAMES_ARMADURA.idle, 0); igual(OBP.FRAMES_ARMADURA.shoot, 5); igual(OBP.FRAMES_ARMADURA.win, 7);
});

// pontuação e recorde (adendo 2)
teste('pontuação soma lâmpadas e bônus de tempo, sempre inteira e nunca negativa', () => {
  igual(OBP.Save.pontuacao(42, 90), 132);
  igual(OBP.Save.pontuacao(0, 0), 0);
  igual(OBP.Save.pontuacao(17, 0), 17, 'estourou o prazo, só as lâmpadas');
  igual(OBP.Save.pontuacao(-5, 10), 10, 'lâmpada negativa não subtrai');
  igual(OBP.Save.pontuacao(10.9, 5.9), 15, 'trunca os dois');
});
teste('recorde: uma chave por fase e por herói, grava só quando supera', () => {
  igual(OBP.Save.chave('fase-01', 'tikinho'), 'obp.recorde.fase-01.tikinho');
  const k = OBP.Save.chave('fase-teste', 'tikinho');
  localStorage.removeItem(k); localStorage.removeItem(OBP.Save.chave('fase-teste', 'gilpp'));
  igual(OBP.Save.ler('fase-teste', 'tikinho'), 0, 'sem recorde ainda');
  igual(OBP.Save.gravar('fase-teste', 'tikinho', 120), true, 'primeiro recorde');
  igual(OBP.Save.ler('fase-teste', 'tikinho'), 120);
  igual(OBP.Save.gravar('fase-teste', 'tikinho', 120), false, 'empate não é recorde');
  igual(OBP.Save.gravar('fase-teste', 'tikinho', 119), false, 'pior não grava');
  igual(OBP.Save.gravar('fase-teste', 'tikinho', 121), true);
  igual(OBP.Save.ler('fase-teste', 'tikinho'), 121);
  igual(OBP.Save.ler('fase-teste', 'gilpp'), 0, 'o outro herói tem chave própria');
  localStorage.removeItem(k);
});
// tiro da armadura (adendo 6): tikinho só sirene; gilpp cicla camisa, calça e chapéu de São João. Cada nome do
// ciclo já é a chave de textura carregada pelo Boot (proj-*, sem atlas: não existe folha 'itens32' nesta versão,
// mesma decisão do Enemy.js), então o teste checa a string em vez de procurar quadro num atlas que não existe.
teste('ciclo de projétil por herói, em ordem e sem fim', () => {
  const t = OBP.HEROIS.tikinho, g = OBP.HEROIS.gilpp;
  igual(OBP.ProjLogic.textura(t, 0), 'proj-sirene'); igual(OBP.ProjLogic.textura(t, 1), 'proj-sirene');
  igual(OBP.ProjLogic.textura(t, 97), 'proj-sirene', 'uma textura só, nunca cicla');
  igual(OBP.ProjLogic.textura(g, 0), 'proj-camisa'); igual(OBP.ProjLogic.textura(g, 1), 'proj-calca');
  igual(OBP.ProjLogic.textura(g, 2), 'proj-chapeu'); igual(OBP.ProjLogic.textura(g, 3), 'proj-camisa', 'volta ao começo');
  igual(OBP.ProjLogic.textura(g, 11), 'proj-chapeu');
  igual(t.projetil.vel, 260); igual(g.projetil.vel, 260, 'mesma velocidade nos dois');
  igual(t.projetil.hitbox, 24); igual(g.projetil.hitbox, 24);
  for (const h of [t, g]) for (const n of h.projetil.ciclo) if (!/^proj-/.test(n)) throw new Error(`chave de textura fora do padrão: ${n}`);
});

// jokenpo do chefe (spec 6): a triade e a sequencia fixa sao puras, entao o teste nao precisa do Phaser
teste('triade: briefing vence prazo, prazo vence verba, verba vence briefing', () => {
  const J = OBP.JOKENPO;
  igual(J.duelo('briefing', 'prazo'), 1); igual(J.duelo('prazo', 'verba'), 1); igual(J.duelo('verba', 'briefing'), 1);
  igual(J.duelo('prazo', 'briefing'), -1); igual(J.duelo('verba', 'prazo'), -1); igual(J.duelo('briefing', 'verba'), -1);
  for (const m of J.MAOS) igual(J.duelo(m, m), 0, 'empate');

});

teste('chefe tem sequencia fixa e a partida e melhor de 3', () => {

// loja de fim de fase (adendo 3): 5 itens, preço em lâmpadas, um item por visita
const lojaEstado = (l) => ({ lampadas: l, coracoesMax: 3, coracoesExtra: 0, pulosExtra: 0, inventario: [] });
teste('loja tem os 5 itens do adendo mais os 2 consumiveis da decisao 86, com os precos', () => {
  igual(OBP.LOJA.length, 7, 'itens');
  igual(OBP.LOJA.map(i => i.id).join(','), 'coracao,pulo-duplo,armadura,cafe,energetico,carimbo,ctrlz', 'ordem da lista');
  igual(OBP.Loja.item('coracao').preco, 30); igual(OBP.Loja.item('pulo-duplo').preco, 15);
  igual(OBP.Loja.item('armadura').preco, 25); igual(OBP.Loja.item('cafe').preco, 10);
  igual(OBP.Loja.item('energetico').preco, 20);
  igual(OBP.Loja.item('nao-existe'), null);
});
teste('comprar desconta o preço, aplica o bônus e não muta o estado antigo', () => {

  igual(r.estado.lampadas, 75); igual(r.estado.inventario.join(), 'armadura');
  igual(e.lampadas, 100, 'o estado de entrada continua intacto'); igual(e.inventario.join(), '');
  igual(OBP.Loja.comprar(lojaEstado(100), 'coracao').estado.coracoesMax, 4);
  igual(OBP.Loja.comprar(lojaEstado(100), 'pulo-duplo').estado.pulosExtra, 1);
  igual(OBP.Loja.comprar(lojaEstado(100), 'cafe').estado.inventario.join(), 'cafe');
  igual(OBP.Loja.comprar(lojaEstado(100), 'energetico').estado.inventario.join(), 'energetico');
});
teste('loja recusa por lâmpadas de menos, por já ter e por slot ocupado', () => {
  igual(OBP.Loja.motivo(lojaEstado(29), 'coracao'), 'LÂMPADAS DE MENOS');
  igual(OBP.Loja.motivo(lojaEstado(30), 'coracao'), null);
  igual(OBP.Loja.comprar(lojaEstado(9), 'cafe').ok, false, 'compra bloqueada não acontece');
  igual(OBP.Loja.comprar(lojaEstado(9), 'cafe').estado.lampadas, 9, 'e não cobra');
  const comCoracao = Object.assign(lojaEstado(100), { coracoesMax: 4 });
  igual(OBP.Loja.motivo(comCoracao, 'coracao'), 'JÁ TEM');
  // armadura consumivel nao tem mais regra de "JA TEM": o teto e o mesmo MAX_POR_ITEM dos outros consumiveis
  const armadoCheio = Object.assign(lojaEstado(100), { inventario: ['armadura', 'armadura', 'armadura'] });
  igual(OBP.Loja.motivo(armadoCheio, 'armadura'), 'JÁ TEM 3', 'teto por consumivel vale pra armadura tambem');
  const comPulo = Object.assign(lojaEstado(100), { pulosExtra: 1 });
  igual(OBP.Loja.motivo(comPulo, 'pulo-duplo'), 'JÁ TEM');
  const cheio = Object.assign(lojaEstado(100), { inventario: ['cafe', 'cafe', 'cafe'] });
  igual(OBP.Loja.motivo(cheio, 'cafe'), 'JÁ TEM 3', 'teto por consumivel'); igual(OBP.Loja.motivo(cheio, 'energetico'), null, 'outro consumivel ainda cabe');
  igual(OBP.Loja.motivo(lojaEstado(100), 'nao-existe'), 'ITEM DESCONHECIDO');
});
// inventario (decisao 93: ctrl+z e armadura viraram ativos): B troca entre ids distintos, N consome uma unidade
teste('inventario: resumo por id, troca circular com B e consumo com N', () => {
  const I = OBP.Inventario, inv = ['cafe', 'carimbo', 'cafe', 'ctrlz'];
  igual(I.resumo(inv).map(r => r.id + r.n).join(), 'cafe2,carimbo1,ctrlz1', 'ctrl+z virou ativo: entra no ciclo do B');
  igual(I.selecionado(inv, 0).id, 'cafe'); igual(I.selecionado(inv, 1).id, 'carimbo'); igual(I.selecionado(inv, 2).id, 'ctrlz');
  igual(I.selecionado(inv, 3).id, 'cafe', 'indice circular');
  igual(I.proximo(inv, 2), 0, 'depois do ultimo volta ao primeiro'); igual(I.proximo([], 0), 0);
  igual(I.gastar(inv, 'ctrlz').join(), 'cafe,carimbo,cafe'); igual(I.gastar(['cafe'], 'ctrlz'), null); igual(I.quantos(inv, 'cafe'), 2);
  const u = I.usar(inv, 0); igual(u.id, 'cafe'); igual(u.inventario.join(), 'carimbo,cafe,ctrlz'); igual(u.sel, 0);
  const uz = I.usar(['ctrlz'], 0); igual(uz.id, 'ctrlz'); igual(uz.inventario.length, 0, 'ctrl+z agora se usa com N, como os outros');
  const u2 = I.usar(['cafe'], 0); igual(u2.inventario.length, 0); igual(u2.sel, 0);
  igual(I.usar([], 0), null, 'sem item nao usa');
  const u3 = I.usar(['cafe', 'carimbo'], 1); igual(u3.id, 'carimbo'); igual(u3.sel, 0, 'selecao volta a caber');
});
